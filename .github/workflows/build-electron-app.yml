name: Build Electron App

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      operatingSystem:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      appleAPIKeyContent:
        required: false
      appleAPIKeyID:
        required: false
      appleAPIIssuerID:
        required: false
      appleCertData:
        required: false
      appleCertKeychainPassword:
        required: false
      appleCertPassword:
        required: false
      token:
        required: true

jobs:
  build-electron-app:
    runs-on: ${{ inputs.operatingSystem }}
    # Guard against the macOS sign/notarize step hanging indefinitely (codesign
    # waiting on a keychain prompt, or notarization stalling). Fail fast instead
    # of burning hours of (10x-billed) macOS runner time.
    timeout-minutes: 45

    steps:
      - name: Write the Apple App Connect API Key to Disk
        uses: timheuer/base64-to-file@v1.2
        id: writeAPIKey
        if: ${{ startsWith(inputs.operatingSystem, 'macos') }}
        with:
          encodedString: ${{ secrets.appleAPIKeyContent }}
          fileName: apikey.p8

      - name: Add Signing Certificate to Keychain
        uses: BoundfoxStudios/action-import-signing-certificate@v1
        if: ${{ startsWith(inputs.operatingSystem, 'macos') }}
        with:
          certificate-data: ${{ secrets.appleCertData }}
          certificate-passphrase: ${{ secrets.appleCertPassword }}
          keychain-name: login
          keychain-password: ${{ secrets.appleCertKeychainPassword }}

      # Without an explicit key partition list, `codesign` blocks forever
      # waiting on a (non-existent in CI) GUI prompt to access the private key.
      # Also disable the keychain auto-lock timeout so long builds don't relock
      # mid-sign. Non-fatal so we still get debug logs if the keychain name
      # differs from expectations.
      - name: Allow codesign to access the signing key
        if: ${{ startsWith(inputs.operatingSystem, 'macos') }}
        continue-on-error: true
        run: |
          KEYCHAIN_PWD="${{ secrets.appleCertKeychainPassword }}"
          for KC in login.keychain-db login.keychain; do
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KC" || true
            security set-keychain-settings -lut 21600 "$KC" || true
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PWD" "$KC" || true
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Packages
        run: pnpm install --frozen-lockfile

      - name: Update Version
        working-directory: ./desktop
        # TODO make sure this commits the version bump
        # after CI is working correctly
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Build and Publish to Github
        run: pnpm --filter @geomancer/desktop run publish ${{ startsWith(inputs.operatingSystem, 'macos') && '--arch=universal' }}
        env:
          # Matches the whole electron-forge toolchain (universal merge, packager,
          # osx-sign, notarize, installer-deb) under both the scoped `@electron/*`
          # and legacy `electron-*` debug namespaces, while excluding noisy deps
          # like vite. This is what surfaces the @electron/universal phase.
          DEBUG: "@electron/*,electron-*"
          APPLE_API_ISSUER_ID: ${{ secrets.appleAPIIssuerID }}
          APPLE_API_KEY: ${{ steps.writeAPIKey.outputs.filePath }}
          APPLE_API_KEY_ID: ${{ secrets.appleAPIKeyID }}
          GITHUB_TOKEN: ${{ secrets.token }}
          NODE_ENV: ${{ inputs.branch }}
