name: Publish to Steam

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      version:
        required: true
        type: string
      zipPrefix:
        required: true
        type: string
    secrets:
      steamBuildUsername:
        required: true
      steamBuildConfigVDF:
        required: true
      # Optional. If provided, a fresh TOTP is generated each run from this Steam
      # Guard shared secret and used in place of the cached `configVdf` session,
      # avoiding periodic "License expired" errors. Falls back to `configVdf`
      # auth when not set.
      steamSharedSecret:
        required: false
      # steamDemoAppID:
      #   required: true
      steamAppID:
        required: true
      token:
        required: true

jobs:
  publish-to-steam:
    runs-on: ubuntu-latest
    environment: "Steam Prod"

    steps:
      - name: Download Builds
        uses: robinraju/release-downloader@v1.8
        with:
          fileName: "*.zip"
          out-file-path: artifacts
          repository: ${{ github.repository }}
          tag: v${{ inputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Ensure the directories exist before extracting builds.
      # - run: mkdir -p builds/darwin
      - run: mkdir -p builds/linux
      - run: mkdir -p builds/win32

      # Rewrite the Windows zip to use forward slashes instead of backslashes.
      - name: Convert Windows Archive to Forward Slashes
        run: 7z rn artifacts/${{ inputs.zipPrefix }}-win32-x64-${{ inputs.version }}.zip $(7z l artifacts/${{ inputs.zipPrefix }}-win32-x64-${{ inputs.version }}.zip | grep '\\' | awk '{ print $6, gensub(/\\/, "/", "g", $6); }' | paste -s)

      - name: Decompress Windows Archive
        run: 7z x artifacts/${{ inputs.zipPrefix }}-win32-x64-${{ inputs.version }}.zip -obuilds/win32

      # - name: Decompress macOS Archive
      #   run: 7z x artifacts/${{ inputs.zipPrefix }}-darwin-universal-${{ inputs.version }}.zip -obuilds/darwin

      - name: Decompress Linux Archive
        run: 7z x artifacts/${{ inputs.zipPrefix }}-linux-x64-${{ inputs.version }}.zip -obuilds/linux

      - name: Debug Secret Availability
        run: |
          if [ -n "${{ secrets.steamBuildUsername }}" ]; then echo "steamBuildUsername is set"; else echo "steamBuildUsername is NOT set"; fi
          if [ -n "${{ secrets.steamBuildConfigVDF }}" ]; then echo "steamBuildConfigVDF is set"; else echo "steamBuildConfigVDF is NOT set"; fi
          if [ -n "${{ secrets.steamSharedSecret }}" ]; then echo "steamSharedSecret is set (TOTP auth will be used)"; else echo "steamSharedSecret is NOT set (configVdf auth will be used)"; fi
          if [ -n "${{ secrets.steamAppID }}" ]; then echo "steamAppID is set"; else echo "steamAppID is NOT set"; fi

      - name: Generate Steam TOTP
        id: steam-totp
        if: ${{ secrets.steamSharedSecret != '' }}
        uses: CyberAndrii/steam-totp@v1
        with:
          shared_secret: ${{ secrets.steamSharedSecret }}

      - name: Publish Builds to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.steamBuildUsername }}
          configVdf: ${{ secrets.steamBuildConfigVDF }}
          totp: ${{ steps.steam-totp.outputs.code }}
          appId: ${{ secrets.steamAppID }}
          buildDescription: ${{ inputs.version }}
          rootPath: builds
          depot2Path: win32
          # depot3Path: darwin
          depot4Path: linux
          releaseBranch: ${{ inputs.branch }}

      # steam-deploy is a Docker container action that writes its logs to
      # `/github/home/Steam/logs` inside the container. The runner bind-mounts
      # `/github/home` from `${{ runner.temp }}/_github_home`, so on failure
      # we copy those files into the workspace and upload them as an artifact.
      - name: Collect Steam Logs on Error
        if: failure()
        run: |
          mkdir -p steam-logs
          if [ -d "${{ runner.temp }}/_github_home/Steam/logs" ]; then
            cp -r "${{ runner.temp }}/_github_home/Steam/logs/." steam-logs/ || true
          else
            echo "No Steam logs directory found at ${{ runner.temp }}/_github_home/Steam/logs"
          fi
          ls -la steam-logs || true

      - name: Save Steam Logs on Error
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          compression-level: 0
          name: steam-logs
          path: steam-logs
          retention-days: 30
